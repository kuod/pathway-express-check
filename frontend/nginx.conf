server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;   # analysis/exports can exceed nginx's 60s default
        proxy_send_timeout 300s;
        client_max_body_size 50m;  # report requests carry the full result matrices
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
